name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate manifests and skill frontmatter
        run: python scripts/validate.py

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: Lint install.sh
        run: shellcheck install.sh

      - name: Smoke test install.sh against this commit
        env:
          SKILLS_DIR: ${{ runner.temp }}/skills
          REF: ${{ github.sha }}
        run: |
          bash install.sh
          # Every skill in the repo must land, with valid frontmatter.
          for skill_md in plugins/*/skills/*/SKILL.md; do
            skill="$(basename "$(dirname "$skill_md")")"
            echo "checking $skill"
            test -f "$SKILLS_DIR/$skill/SKILL.md"
            head -1 "$SKILLS_DIR/$skill/SKILL.md" | grep -qx -- '---'
          done

      - name: Smoke test selective install
        env:
          SKILLS_DIR: ${{ runner.temp }}/skills-selective
          REF: ${{ github.sha }}
        run: |
          bash install.sh clean-code
          test -f "$SKILLS_DIR/clean-code/SKILL.md"
          test ! -d "$SKILLS_DIR/project-blueprint"
